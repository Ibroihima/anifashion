{% extends 'base.html' %}
{% block title %}Inscription – Anifashion{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="auth-left">
    <div class="auth-deco">
      <div class="auth-circle auth-circle-1"></div>
      <div class="auth-circle auth-circle-2"></div>
      <div class="auth-brand">
        <p class="auth-tagline">✦ Rejoignez-nous</p>
        <div class="logo" style="font-size:2.8rem">Ani<span>fashion</span></div>
        <p style="color:rgba(255,255,255,.6);margin-top:20px;font-weight:300">Créez votre compte gratuitement</p>
      </div>
    </div>
  </div>
  <div class="auth-right">
    <div class="auth-box">
      <h2 class="auth-title">Créer un compte</h2>
      <p class="auth-sub">Rejoignez la famille Anifashion</p>
      <form method="POST" action="{{ url_for('inscription') }}" class="auth-form">
        <div class="form-row">
          <div class="form-group">
            <label>Prénom</label>
            <input type="text" name="prenom" placeholder="Votre prénom" required>
          </div>
          <div class="form-group">
            <label>Nom</label>
            <input type="text" name="nom" placeholder="Votre nom" required>
          </div>
        </div>
        <div class="form-group">
          <label>Adresse email</label>
          <input type="email" name="email" placeholder="votre@email.com" required>
        </div>
        <div class="form-group">
          <label>Mot de passe</label>
          <input type="password" name="password" placeholder="Minimum 6 caractères" required>
        </div>
        <div class="form-group">
          <label>Confirmer le mot de passe</label>
          <input type="password" name="confirm" placeholder="Répétez votre mot de passe" required>
        </div>
        <button type="submit" class="btn-primary w-full">Créer mon compte →</button>
      </form>
      <p class="auth-switch">Déjà un compte ? <a href="{{ url_for('login') }}">Se connecter</a></p>
    </div>
  </div>
</div>
{% endblock %}
