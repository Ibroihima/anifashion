{% extends 'client/base_client.html' %}
{% block title %}Mon Profil – Anifashion{% endblock %}
{% block dashboard_content %}

<div class="dash-header">
  <h1>Mon <em>Profil</em></h1>
  <p>Gérez vos informations personnelles et votre mot de passe.</p>
</div>

<form method="POST" action="{{ url_for('client_profil') }}" class="profile-form">
  <div class="form-card">
    <h3 class="form-card-title">Informations personnelles</h3>
    <div class="form-row">
      <div class="form-group">
        <label>Prénom</label>
        <input type="text" name="prenom" value="{{ user.prenom }}" required>
      </div>
      <div class="form-group">
        <label>Nom</label>
        <input type="text" name="nom" value="{{ user.nom }}" required>
      </div>
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" value="{{ user.email }}" disabled style="opacity:.6">
    </div>
    <div class="form-group">
      <label>Téléphone</label>
      <input type="tel" name="telephone" value="{{ user.telephone or '' }}" placeholder="06 00 00 00 00">
    </div>
  </div>

  <div class="form-card">
    <h3 class="form-card-title">Adresse de livraison</h3>
    <div class="form-group">
      <label>Adresse</label>
      <input type="text" name="adresse" value="{{ user.adresse or '' }}" placeholder="123 rue de la Mode">
    </div>
    <div class="form-group">
      <label>Ville</label>
      <input type="text" name="ville" value="{{ user.ville or '' }}" placeholder="Paris">
    </div>
  </div>

  <div class="form-card">
    <h3 class="form-card-title">Changer le mot de passe</h3>
    <div class="form-group">
      <label>Ancien mot de passe</label>
      <input type="password" name="ancien_mdp" placeholder="Laissez vide pour ne pas changer">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Nouveau mot de passe</label>
        <input type="password" name="nouveau_mdp" placeholder="Nouveau mot de passe">
      </div>
    </div>
  </div>

  <button type="submit" class="btn-primary">Sauvegarder les modifications →</button>
</form>

{% endblock %}
